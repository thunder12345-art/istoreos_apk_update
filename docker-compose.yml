services:
  apk-updater:
    build:
      context: .
      dockerfile: Dockerfile
    image: apk-updater:latest
    container_name: apk-updater
    restart: unless-stopped
    volumes:
      - "${APK_DIR:-/mnt/sata1-1/TV}:/download"
      - ./data:/data
    environment:
      TZ: "Asia/Shanghai"

      MODE: "${MODE:-release}"
      GITHUB_REPO: "${GITHUB_REPO:-FongMi/Release}"
      RELEASE_TAG: "${RELEASE_TAG:-}"
      INCLUDE_PRERELEASE: "${INCLUDE_PRERELEASE:-0}"
      ASSET_PATTERN: "${ASSET_PATTERN:-leanback-armeabi_v7a.apk,mobile-arm64_v8a.apk}"
      EXTRA_TARGETS: "${EXTRA_TARGETS:-module|*.apk|0}"

      RAW_PATH: "${RAW_PATH:-}"
      RAW_URL: "${RAW_URL:-}"
      RAW_BASE: "${RAW_BASE:-https://raw.githubusercontent.com}"
      GITHUB_BRANCH: "${GITHUB_BRANCH:-main}"
      VERSION_URL: "${VERSION_URL:-}"

      DOWNLOAD_DIR: "/download"
      FILE_STEM: "${FILE_STEM:-}"
      STABLE_NAME: "${STABLE_NAME:-auto}"
      KEEP_VERSIONS: "${KEEP_VERSIONS:-1}"

      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-86400}"
      RUN_ON_START: "${RUN_ON_START:-1}"
      RUN_ONCE: "${RUN_ONCE:-0}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-30}"

      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      PROXY_PREFIX: "${PROXY_PREFIX:-}"
      STATE_FILE: "/data/state.json"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
